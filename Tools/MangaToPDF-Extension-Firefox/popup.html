<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    h1 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    h1 span { font-size: 18px; }
    .btn {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
    .btn-primary { background: #22c55e; color: #000; }
    .btn-primary:hover:not(:disabled) { background: #16a34a; }
    .btn-secondary { background: #3b82f6; color: #fff; }
    .btn-secondary:hover:not(:disabled) { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .info {
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
      color: #9ca3af;
      min-height: 20px;
    }
    .info strong { color: #fff; }
    .divider { border: none; border-top: 1px solid #2d2d44; margin: 10px 0; }
    .row { display: flex; gap: 6px; }
    .row .btn { flex: 1; }
    label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9ca3af; margin-bottom: 6px; }
    label input[type="range"] { flex: 1; accent-color: #22c55e; }
    .badge {
      display: inline-block;
      background: #22c55e;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 99px;
    }
    .footer { font-size: 10px; color: #4b5563; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <h1><span>📖</span> Manga→PDF</h1>

  <div id="status" class="info">Готов</div>

  <button id="scanBtn" class="btn btn-primary">🔍 Сканировать страницу</button>

  <button id="manualBtn" class="btn btn-secondary">✏️ Ручной режим</button>

  <hr class="divider">

  <div class="row">
    <button id="downloadBtn" class="btn btn-secondary" disabled>📥 PDF</button>
    <button id="clearBtn" class="btn btn-danger" disabled>✕</button>
  </div>

  <hr class="divider">

  <label>
    <span>Качество</span>
    <input type="range" id="quality" min="50" max="100" value="92">
    <span id="qualityLabel">92%</span>
  </label>

  <label>
    <span>Имя файла (без .pdf)</span>
  </label>
  <input type="text" id="filename" placeholder="auto — из тайтла"
    style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid #2d2d44;background:#111;color:#e0e0e0;font-size:12px;outline:none;">

  <div class="footer">Shift+клик — добавить/убрать страницу</div>

  <script src="popup.js"></script>
</body>
</html>

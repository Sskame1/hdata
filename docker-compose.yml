services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - D:/hdata/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=hdata
      - POSTGRES_PASSWORD=hdata
      - POSTGRES_DB=hdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdata"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - API_URL=
      - DATABASE_URL=postgresql://hdata:hdata@postgres:5432/hdata
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
      - S3_BUCKET=hdata

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - D:/minio/data:/data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 admin admin123;
        mc mb myminio/hdata --ignore-existing;
        echo 'Bucket hdata created';
      "



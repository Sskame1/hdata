services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hdata
      POSTGRES_PASSWORD: hdata
      POSTGRES_DB: hdata
    ports:
      - "5432:5432"
    volumes:
      - D:/hdata/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdata"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - D:/hdata/minio:/data

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://hdata:hdata@postgres:5432/hdata
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: hdata
      STORAGE_PATH: /data
    volumes:
      - D:/hdata/minio:/data
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/backend
    depends_on:
      - backend
    ports:
      - "3000:3000"

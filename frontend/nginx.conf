server {
    listen 80;
    server_name _;

    client_max_body_size 2000M;

    root /usr/share/nginx/html;
    index index.html;

    location /uploads {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://backend:3001/media/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
